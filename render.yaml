services:
  - type: web
    name: licitaia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MP_TICKET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
